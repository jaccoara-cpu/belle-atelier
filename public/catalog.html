 "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin-mobile": "1.25rem", "gutter": "1.5rem", "space-xl": "3.5rem", "margin-tablet": "2.5rem", "space-sm": "0.5rem", "space-md": "1rem", "space-xs": "0.25rem", "space-lg": "2rem", "margin": "4rem", "gutter-mobile": "1rem" }, "fontFamily": { "headline": ["Cormorant Garamond", "Playfair Display", "serif"], "headline-lg-mobile": ["Cormorant Garamond", "Playfair Display", "serif"], "headline-lg": ["Cormorant Garamond", "Playfair Display", "serif"], "body-md": ["Montserrat", "sans-serif"], "display-md-mobile": ["Cormorant Garamond", "Playfair Display", "serif"], "body-sm": ["Montserrat", "sans-serif"], "title-md": ["Montserrat", "sans-serif"], "display-lg-mobile": ["Cormorant Garamond", "Playfair Display", "serif"], "body-lg": ["Montserrat", "sans-serif"], "headline-md": ["Cormorant Garamond", "Playfair Display", "serif"], "label-caps": ["Montserrat", "sans-serif"], "display-md": ["Cormorant Garamond", "Playfair Display", "serif"], "headline-sm": ["Cormorant Garamond", "Playfair Display", "serif"], "label-sm": ["Montserrat", "sans-serif"], "display-lg": ["Cormorant Garamond", "Playfair Display", "serif"] }, "fontSize": { "headline-lg-mobile": ["26px", { "lineHeight": "34px", "fontWeight": "400" }], "headline-lg": ["36px", { "lineHeight": "44px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "24px", "fontWeight": "400" }], "display-md-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "400" }], "body-sm": ["12px", { "lineHeight": "20px", "fontWeight": "400" }], "title-md": ["18px", { "lineHeight": "26px", "letterSpacing": "0.01em", "fontWeight": "500" }], "display-lg-mobile": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.01em", "fontWeight": "400" }], "body-lg": ["16px", { "lineHeight": "28px", "fontWeight": "400" }], "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "400" }], "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.18em", "font <header class="sticky top-0 left-0 w-full z-50 bg-surface/95 backdrop-blur-md border-b border-surface-container-high">

        <span class="material-symbols-outlined text-[26px]">menu</span>

      <a class="flex items-center gap-3 group" href="index.html">
        <img src="images/logo.png" alt="Belle Atelier Logo" class="h-10 w-10 sm:h-12 sm:w-12 object-contain rounded-full shadow-xs ring-1 ring-secondary/20 group-hover:scale-105 transition-transform" />
        <div class="flex flex-col">

    <div class="flex items-center gap-2 sm:gap-3">

      <button onclick="openWishlistModal()" class="relative p-2 text-on-surface hover:text-primary transition-colors" aria-label="Обране">

      <a href="cart.html" class="relative p-2 text-on-surface hover:text-primary transition-colors flex items-center" aria-label="Кошик">

        <span class="cart-badge-count absolute top-0 right-0 w-4 h-4 bg-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center">1</span>

  </div>

  <!-- Clean Slide-Down Menu for Mobile & Desktop Drawer -->

      <a class="hover:text-primary py-0.5 flex items-center gap-2 uppercase" href="index.html#contacts">

<main class="w-full bg-surface min-h-screen">
  <div class="flex flex-col w-full">
    <!-- Header: Title "Каталог" -->
    <section class="max-w-5xl mx-auto w-full px-4 sm:px-6 pt-5 pb-1 text-center">
      <h1 class="font-headline text-3xl sm:text-4xl text-primary font-bold tracking-tight">Каталог</h1>
    </section>

    <!-- UNPINNED TOP FILTER PANEL (Search, Categories, Sorting, and Bottom Collapse Button) -->
    <div class="w-full bg-surface-container-low/60 border-b border-surface-container-high transition-all" id="catalog-filters-main-wrapper">
      <div class="max-w-4xl mx-auto w-full px-4 sm:px-6 py-3">
        
        <!-- Toggle Bar Header (Always accessible at top of filter block) -->
        <div class="flex items-center justify-between gap-3">
          <!-- Active Filter indicator / summary -->
          <div class="flex items-center gap-2 overflow-hidden">
            <span class="material-symbols-outlined text-primary text-[18px]">tune</span>
            <span class="text-xs font-semibold uppercase tracking-wider text-primary truncate" id="filter-current-status-label">
              Весь каталог
            </span>
          </div>

          <!-- Open Filters Button (Shown when collapsed) -->
          <button id="toggle-filter-panel-btn" onclick="toggleCatalogFilters()" type="button" class="py-1 px-3 bg-surface hover:bg-surface-container text-on-surface border border-surface-container-high rounded-xs text-xs font-semibold uppercase tracking-wider flex items-center gap-1.5 transition-colors shadow-2xs">
            <span id="toggle-filter-text">Сховати</span>
            <span id="toggle-filter-icon" class="material-symbols-outlined text-[16px] transition-transform">expand_less</span>
          </button>
        </div>

        <!-- Collapsible Filter Content (Open by default) -->
        <div id="collapsible-filters-area" class="space-y-3 pt-3 transition-all">
          <!-- Search Input: "Введіть назву виробу" -->
          <div class="relative max-w-xl mx-auto">
            <input class="w-full py-2.5 pl-4 pr-11 bg-surface-container-lowest border border-surface-container-high font-body text-xs text-on-surface focus:outline-none focus:border-primary placeholder:text-outline shadow-xs rounded-xs" id="catalog-search" placeholder="Введіть назву виробу..." type="text"/>
            <span class="material-symbols-outlined text-[18px] text-secondary absolute right-3.5 top-2.5 pointer-events-none">search</span>
          </div>

          <!-- Full-width top button: Весь каталог -->
          <div class="max-w-2xl mx-auto" id="catalog-all-category-btn-container">
            <!-- Rendered by JS -->
          </div>

          <!-- Categories in neat narrow rectangles, 2 per row -->
          <div class="grid grid-cols-2 gap-2 max-w-2xl mx-auto max-h-56 overflow-y-auto pr-1" id="catalog-category-grid">
            <!-- Dynamically rendered -->
          </div>

          <!-- Sorting Controls Row -->
          <div class="flex items-center justify-end gap-2 pt-1 border-t border-surface-container-high/60 max-w-2xl mx-auto">
            <label class="text-xs text-on-surface-variant font-medium whitespace-nowrap" for="catalog-sort">Сортувати:</label>
            <div class="relative bg-surface-container-lowest border border-surface-container-high rounded-xs w-full sm:w-auto">
              <select class="w-full font-body text-xs py-1.5 pl-3 pr-8 bg-transparent text-on-surface appearance-none focus:outline-none cursor-pointer" id="catalog-sort">
                <option value="new">Новинки</option>
                <option value="price-desc">Ціна від найвищої до найнижчої</option>
                <option value="price-asc">Ціна від найнижчої до найвищої</option>
                <option value="title-asc">Назва «А-Я»</option>
                <option value="title-desc">Назва «Я-А»</option>
              </select>
              <span class="material-symbols-outlined text-[18px] text-secondary absolute right-2 top-1.5 pointer-events-none">expand_more</span>
            </div>
          </div>

          <!-- Elongated Bottom Button to Collapse Filters -->
          <div class="pt-2 max-w-2xl mx-auto">
            <button onclick="toggleCatalogFilters()" type="button" class="w-full py-2 px-4 bg-surface hover:bg-surface-container-high text-on-surface-variant hover:text-primary border border-surface-container-high rounded-xs text-xs font-semibold uppercase tracking-wider flex items-center justify-center gap-1.5 transition-colors shadow-2xs">
              <span>Сховати панель фільтрів</span>
              <span class="material-symbols-outlined text-[16px]">expand_less</span>
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- Main Catalog Grid Section -->
    <section class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6">
      <!-- Dynamic Product Grid -->
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-5 md:gap-6" id="catalog-products-container">
        <!-- Rendered dynamically by JavaScript -->
      </div>

      <!-- Ukrainian Geometric Divider between Grid and Pagination -->
      <div class="flex items-center justify-center gap-space-md py-space-md">
        <div class="h-px flex-1 bg-surface-container-highest"></div>
        <div class="flex items-center gap-1 text-secondary opacity-60">
          <span class="w-1.5 h-1.5 rotate-45 bg-secondary"></span>
          <span class="w-2.5 h-2.5 rotate-45 bg-primary"></span>
          <span class="w-1.5 h-1.5 rotate-45 bg-secondary"></span>
        </div>
        <div class="h-px flex-1 bg-surface-container-highest"></div>
      </div>

      <!-- Pagination & Load More Section -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-space-md pb-space-lg">
        <span class="font-body-sm text-xs text-on-surface-variant" id="catalog-pagination-info">
          Відображено <strong class="text-on-surface font-semibold" id="count-shown">8</strong> із <strong class="text-on-surface font-semibold" id="count-total">28</strong> виробів
        </span>
        <div class="flex items-center gap-space-sm">
          <button id="load-more-btn" onclick="loadMoreProducts()" class="px-6 py-2.5 bg-surface-container hover:bg-surface-container-highest text-on-surface font-label-caps text-xs uppercase tracking-widest transition-colors flex items-center gap-2 border border-surface-container-high" type="button">
            <span>Показати більше</span>
            <span class="material-symbols-outlined text-[16px]">expand_more</span>
          </button>
        </div>
        <!-- Page numbers -->
        <div class="flex items-center gap-1 font-label-caps text-xs" id="catalog-page-numbers">
          <!-- Dynamic pagination buttons -->
        </div>
      </div>
    </section>
  </div>
</main>

<script src="js/cart-store.js"></script>
<script>
  // Wishlist state handling via BelleStore
  window.toggleWishlist = function(idOrName) {
    if (typeof BelleStore !== 'undefined') {
      BelleStore.toggleWishlistById(idOrName);
      renderCatalog();
    }
  };

  // Dynamic Products Catalog from BelleStore
  function getAllProducts() {
    return (typeof BelleStore !== 'undefined' && BelleStore.getActiveProducts) 
      ? BelleStore.getActiveProducts() 
      : [];
  }

  const ITEMS_PER_PAGE = 8;
  let currentPage = 1;
  let activeCategory = 'all';
  let searchQuery = '';
  let sortOption = 'new';

  document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('catalog-search');
    const sortSelect = document.getElementById('catalog-sort');

    // Parse URL param for category
    const urlParams = new URLSearchParams(window.location.search);
    const initialCat = urlParams.get('category');
    if (initialCat) {
      activeCategory = initialCat;
    }

    window.addEventListener('belle-products-updated', () => {
      renderCategoryGrid();
      renderCatalog();
    });

    window.addEventListener('belle-categories-updated', () => {
      renderCategoryGrid();
      renderCatalog();
    });

    window.addEventListener('belle-wishlist-updated', () => {
      renderCatalog();
    });

    // Filter toggle logic (open by default)
    let filtersExpanded = true;
    window.toggleCatalogFilters = function() {
      filtersExpanded = !filtersExpanded;
      const area = document.getElementById('collapsible-filters-area');
      const text = document.getElementById('toggle-filter-text');
      const icon = document.getElementById('toggle-filter-icon');
      if (area) {
        if (filtersExpanded) {
          area.classList.remove('hidden');
          if (text) text.textContent = 'Сховати';
          if (icon) icon.textContent = 'expand_less';
        } else {
          area.classList.add('hidden');
          if (text) text.textContent = 'Фільтри';
          if (icon) icon.textContent = 'expand_more';
        }
      }
    };

    function renderCategoryGrid() {
      const gridContainer = document.getElementById('catalog-category-grid');
      const statusLabel = document.getElementById('filter-current-status-label');
      const categories = (typeof BelleStore !== 'undefined' && BelleStore.getCategories) ? BelleStore.getCategories() : [];
      const allProds = getAllProducts();
      const allBtnContainer = document.getElementById('catalog-all-category-btn-container');

      const activeCatObj = categories.find(c => c.id === activeCategory);
      if (statusLabel) {
        if (activeCategory === 'all') {
          statusLabel.textContent = `Весь каталог`;
        } else if (activeCatObj) {
          statusLabel.textContent = `${activeCatObj.name}`;
        }
      }

      // 1. Render long elongated top button for "Весь каталог"
      if (allBtnContainer) {
        const isAllActive = activeCategory === 'all';
        allBtnContainer.innerHTML = `
          <button onclick="selectCategory('all')" type="button" class="w-full flex items-center justify-between p-3 border transition-all rounded-xs text-left ${
            isAllActive 
              ? 'bg-primary text-white border-primary shadow-xs font-bold' 
              : 'bg-surface-container-lowest border-surface-container-high hover:border-primary/50 text-on-surface'
          }">
            <span class="flex items-center gap-2.5">
              <span class="material-symbols-outlined text-[18px]">grid_view</span>
              <span class="text-xs uppercase tracking-wider font-bold">Весь каталог</span>
            </span>
            <span class="flex items-center gap-1 text-xs opacity-75">
              <span>${allProds.length}</span>
              <span class="material-symbols-outlined text-[16px]">chevron_right</span>
            </span>
          </button>
        `;
      }

      // 2. Render categories in 2-column neat narrow rectangles
      if (gridContainer) {
        gridContainer.innerHTML = categories.map(cat => {
          const isSale = cat.id === 'sale' || cat.isSale || cat.name.toUpperCase().includes('SALE');
          const isActive = activeCategory === cat.id;
          const count = allProds.filter(p => isSale ? p.sale : (p.cat === cat.id || p.category === cat.id)).length;

          let btnClass = '';
          if (isActive) {
            btnClass = isSale 
              ? 'bg-red-600 text-white border-red-600 shadow-xs font-bold' 
              : 'bg-primary text-white border-primary shadow-xs font-bold';
          } else {
            btnClass = isSale 
              ? 'bg-red-50 hover:bg-red-100 border-red-200 text-red-600 font-bold' 
              : 'bg-surface-container-lowest border-surface-container-high hover:border-primary/50 text-on-surface';
          }

          return `
            <button onclick="selectCategory('${cat.id}')" type="button" class="flex items-center justify-between p-2.5 sm:p-3 border ${btnClass} transition-all rounded-xs text-left">
              <span class="flex items-center gap-1.5 truncate">
                <span class="material-symbols-outlined text-[16px] shrink-0">${isSale ? 'local_offer' : (cat.icon || 'folder')}</span>
                <span class="text-xs uppercase tracking-wider truncate ${isSale && !isActive ? 'text-red-600 font-bold' : ''}">${cat.name}</span>
              </span>
              <span class="flex items-center gap-0.5 text-[11px] opacity-70 shrink-0 ml-1">
                <span>(${count})</span>
                <span class="material-symbols-outlined text-[14px]">chevron_right</span>
              </span>
            </button>
          `;
        }).join('');
      }

      // Also populate mobile top drawer categories
      const topNavList = document.getElementById('catalog-nav-categories-list');
      if (topNavList) {
        topNavList.innerHTML = categories.map(cat => {
          const isSale = cat.id === 'sale' || cat.isSale || cat.name.toUpperCase().includes('SALE');
          if (isSale) {
            return `<a class="text-red-600 font-bold py-1 hover:text-red-700 flex items-center gap-2" href="catalog.html?category=${cat.id}">
              <span class="material-symbols-outlined text-[18px]">local_offer</span>
              <span>${cat.name}</span>
            </a>`;
          }
          return `<a class="text-on-surface py-1 hover:text-primary flex items-center gap-2" href="catalog.html?category=${cat.id}">
            <span class="material-symbols-outlined text-[18px] text-secondary">${cat.icon || 'folder'}</span>
            <span>${cat.name}</span>
          </a>`;
        }).join('');
      }
    }

    // Filter and Sorting Logic
    function getFilteredProducts() {
      let list = getAllProducts().filter(item => {
        const matchesQuery = !searchQuery || item.name.toLowerCase().includes(searchQuery.toLowerCase()) || (item.art && item.art.toLowerCase().includes(searchQuery.toLowerCase()));
        let matchesCat = true;
        if (activeCategory === 'all') {
          matchesCat = true;
        } else if (activeCategory === 'sale') {
          matchesCat = Boolean(item.sale);
        } else {
          matchesCat = item.cat === activeCategory;
        }
        return matchesQuery && matchesCat;
      });

      // 5 Sort Options:
      // 1. new (Новинки)
      // 2. price-desc (Ціна від найвищої до найнижчої)
      // 3. price-asc (Ціна від найнижчої до найвищої)
      // 4. title-asc (Назва «А-Я»)
      // 5. title-desc (Назва «Я-А»)
      if (sortOption === 'new') {
        list.sort((a, b) => (b.id || '').localeCompare(a.id || ''));
      } else if (sortOption === 'price-desc') {
        list.sort((a, b) => Number(b.price) - Number(a.price));
      } else if (sortOption === 'price-asc') {
        list.sort((a, b) => Number(a.price) - Number(b.price));
      } else if (sortOption === 'title-asc') {
        list.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'uk'));
      } else if (sortOption === 'title-desc') {
        list.sort((a, b) => (b.name || '').localeCompare(a.name || '', 'uk'));
      }

      return list;
    }

    function renderCatalog() {
      const container = document.getElementById('catalog-products-container');
      const filtered = getFilteredProducts();
      const totalCount = filtered.length;
      const totalPages = Math.max(1, Math.ceil(totalCount / ITEMS_PER_PAGE));

      if (currentPage > totalPages) currentPage = totalPages;

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const endIndex = startIndex + ITEMS_PER_PAGE;
      const visibleProducts = filtered.slice(startIndex, endIndex);

      // Render cards
      if (visibleProducts.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 text-on-surface-variant">
            <span class="material-symbols-outlined text-4xl text-outline mb-2">search_off</span>
            <p class="font-headline text-lg">За вашим запитом нічого не знайдено</p>
            <button onclick="resetCatalogFilters()" class="mt-3 px-5 py-2.5 bg-primary text-white text-xs uppercase tracking-wider font-semibold hover:bg-tertiary transition-colors">Скинути пошук</button>
          </div>
        `;
      } else {
        container.innerHTML = visibleProducts.map((p, idx) => {
          const isWishlisted = (typeof BelleStore !== 'undefined') 
            ? (BelleStore.isWishlisted(p.id) || BelleStore.isWishlisted(p.name)) 
            : false;
          const saleTag = p.sale ? `
            <div class="absolute top-2 left-2 z-10 pointer-events-none">
              <span class="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 uppercase tracking-wider rounded-xs shadow-xs">${p.sale}</span>
            </div>
          ` : '';
          const oldPriceHtml = p.oldPrice ? `<span class="text-[11px] text-outline line-through ml-1.5">${p.oldPrice.toLocaleString('uk-UA')} ₴</span>` : '';

          return `
            <article class="group flex flex-col bg-surface-container-lowest transition-all duration-300 hover:shadow-md border border-surface-container-high/70 hover:border-primary/40 rounded-xs overflow-hidden">
              <div class="relative aspect-[3/4] w-full overflow-hidden bg-surface-container">
                <a href="product.html?id=${p.id}" class="block w-full h-full">
                  <img class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" alt="${p.name}" src="${p.img}"/>
                </a>
                ${saleTag}
                <button onclick="event.preventDefault(); event.stopPropagation(); toggleWishlist('${p.id}')" aria-label="Додати в обране" class="absolute top-2 right-2 w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-white/95 hover:bg-white flex items-center justify-center transition-all shadow-xs z-10 active:scale-90" type="button">
                  <span class="material-symbols-outlined text-[16px] sm:text-[18px] transition-colors ${isWishlisted ? 'text-red-600' : 'text-on-surface hover:text-red-600'}" style="font-variation-settings: 'FILL' ${isWishlisted ? 1 : 0};">favorite</span>
                </button>
              </div>
              <div class="flex flex-col flex-1 justify-between p-3 sm:p-3.5">
                <h2 class="font-headline text-base sm:text-lg font-semibold tracking-tight text-on-surface group-hover:text-primary transition-colors leading-snug line-clamp-2">
                  <a href="product.html?id=${p.id}" class="hover:underline">${p.name}</a>
                </h2>
                <div class="mt-2.5 flex items-baseline justify-between pt-1 border-t border-surface-container-high/40">
                  <div>
                    <span class="font-headline text-base sm:text-lg font-bold tracking-tight text-primary">${p.price.toLocaleString('uk-UA')} ₴</span>
                    ${oldPriceHtml}
                  </div>
                  <span class="text-[10px] text-outline font-body font-medium uppercase tracking-wider">${p.inStock ? 'В наявності' : 'Під замовлення'}</span>
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      // Update Pagination Stats
      const countShown = document.getElementById('count-shown');
      const countTotal = document.getElementById('count-total');
      if (countShown) countShown.textContent = visibleProducts.length;
      if (countTotal) countTotal.textContent = totalCount;

      // Render Page Buttons
      const pageNumbersContainer = document.getElementById('catalog-page-numbers');
      if (pageNumbersContainer) {
        let pageBtnsHtml = '';
        for (let i = 1; i <= totalPages; i++) {
          if (i === currentPage) {
            pageBtnsHtml += `<button class="w-8 h-8 bg-primary text-white font-bold flex items-center justify-center rounded-xs">${i}</button>`;
          } else {
            pageBtnsHtml += `<button onclick="goToPage(${i})" class="w-8 h-8 bg-surface-container hover:bg-surface-container-highest text-on-surface flex items-center justify-center transition-colors border border-surface-container-high rounded-xs">${i}</button>`;
          }
        }
        if (currentPage < totalPages) {
          pageBtnsHtml += `
            <button onclick="goToPage(${currentPage + 1})" class="w-8 h-8 bg-surface-container hover:bg-surface-container-highest text-on-surface flex items-center justify-center transition-colors border border-surface-container-high rounded-xs">
              <span class="material-symbols-outlined text-[14px]">chevron_right</span>
            </button>
          `;
        }
        pageNumbersContainer.innerHTML = pageBtnsHtml;
      }

      // Load more button visibility
      const loadMoreBtn = document.getElementById('load-more-btn');
      if (loadMoreBtn) {
        loadMoreBtn.style.display = (currentPage < totalPages) ? 'inline-flex' : 'none';
      }
    }

    window.goToPage = function(page) {
      currentPage = page;
      renderCatalog();
      window.scrollTo({ top: 180, behavior: 'smooth' });
    };

    window.loadMoreProducts = function() {
      currentPage++;
      renderCatalog();
      window.scrollTo({ top: 180, behavior: 'smooth' });
    };

    // Category click handler
    window.selectCategory = function(cat) {
      activeCategory = cat;
      currentPage = 1;
      renderCategoryGrid();
      renderCatalog();
    };

    window.resetCatalogFilters = function() {
      if (searchInput) searchInput.value = '';
      searchQuery = '';
      selectCategory('all');
      BelleStore.showToast('Пошук скинуто');
    };

    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        currentPage = 1;
        renderCatalog();
      });
    }

    if (sortSelect) {
      sortSelect.addEventListener('change', (e) => {
        sortOption = e.target.value;
        currentPage = 1;
        renderCatalog();
      });
    }

    // Mobile menu toggle
    const mobileBtn = document.getElementById('mobile-menu-btn');
    const mobileNav = document.getElementById('mobile-nav');
    if (mobileBtn && mobileNav) {
      mobileBtn.addEventListener('click', () => {
        mobileNav.classList.toggle('hidden');
      });
    }

    // Initial render
    renderCategoryGrid();
    renderCatalog();
  });

  // Modal logic for Policies, Offer, Privacy, About, Reviews
  let reviewSlideIndex = 0;
  window.openPolicyModal = function(type) {
    const modal = document.getElementById('policy-modal');
    const content = document.getElementById('policy-modal-content');
    if (!modal || !content) return;

    const texts = (typeof BelleStore !== 'undefined' && BelleStore.getSiteTexts) 
      ? BelleStore.getSiteTexts() 
      : {};

    if (type === 'about') {
      const raw = texts.about_text || '';
      const paragraphs = raw.split('\n').filter(p => p.trim()).map(p => `<p class="leading-relaxed">${p.trim()}</p>`).join('');
      content.innerHTML = `
        <div class="flex items-center gap-2 text-primary mb-3">
          <span class="material-symbols-outlined text-2xl">info</span>
          <h3 class="font-headline text-2xl font-bold">Про ательє Belle Atelier</h3>
        </div>
        <div class="space-y-3 text-xs text-on-surface leading-relaxed">
          ${paragraphs}
        </div>
      `;
    } else if (type === 'reviews') {
      const reviews = BelleStore.getCustomerReviews();
      reviewSlideIndex = 0;
      content.innerHTML = `
        <div class="flex items-center justify-between gap-2 text-primary mb-4 pb-2 border-b border-surface-container-high">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-2xl">star</span>
            <h3 class="font-headline text-2xl font-bold">Відгуки клієнтів</h3>
          </div>
          <span class="text-xs text-secondary font-medium">Фотогалерея</span>
        </div>
        
        <div class="relative w-full aspect-[4/3] bg-surface-container-low rounded-xs overflow-hidden border border-surface-container-high shadow-xs">
          <img id="review-modal-img" src="${reviews[0] ? reviews[0].img : '/images/berehynia_dress_1789843600634.jpg'}" class="w-full h-full object-contain p-2 transition-opacity duration-300" alt="Відгук" />
          
          <button type="button" onclick="prevReviewSlide()" class="absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/80 hover:bg-white text-primary flex items-center justify-center shadow-md">
            <span class="material-symbols-outlined text-[20px]">chevron_left</span>
          </button>
          <button type="button" onclick="nextReviewSlide()" class="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/80 hover:bg-white text-primary flex items-center justify-center shadow-md">
            <span class="material-symbols-outlined text-[20px]">chevron_right</span>
          </button>
        </div>

        <p id="review-modal-caption" class="text-center text-xs text-secondary mt-3 italic font-medium">
          ${reviews[0] ? (reviews[0].caption || 'Фото відгуку клієнтки') : ''}
        </p>

        <div class="flex items-center justify-center gap-1.5 mt-2" id="review-dots-container">
          ${reviews.map((_, i) => `<span class="w-2 h-2 rounded-full ${i === 0 ? 'bg-primary' : 'bg-outline/30'}"></span>`).join('')}
        </div>
      `;
    } else if (type === 'offer') {
      const raw = texts.offer_text || '';
      const paragraphs = raw.split('\n').filter(p => p.trim()).map(p => `<p class="leading-relaxed">${p.trim()}</p>`).join('');
      content.innerHTML = `
        <div class="flex items-center gap-2 text-primary mb-3">
          <span class="material-symbols-outlined text-2xl">description</span>
          <h3 class="font-headline text-2xl font-bold">Договір оферти</h3>
        </div>
        <div class="space-y-3 text-xs text-on-surface leading-relaxed font-mono">
          ${paragraphs}
        </div>
      `;
    } else if (type === 'privacy') {
      const raw = texts.privacy_text || '';
      const paragraphs = raw.split('\n').filter(p => p.trim()).map(p => `<p class="leading-relaxed">${p.trim()}</p>`).join('');
      content.innerHTML = `
        <div class="flex items-center gap-2 text-primary mb-3">
          <span class="material-symbols-outlined text-2xl">shield</span>
          <h3 class="font-headline text-2xl font-bold">Політика конфіденційності</h3>
        </div>
        <div class="space-y-3 text-xs text-on-surface leading-relaxed">
          ${paragraphs}
        </div>
      `;
    } else if (type === 'rules') {
      const rawRules = texts.rules_text || '';
      const paragraphs = rawRules.split('\n').filter(p => p.trim()).map(p => `<p class="leading-relaxed">${p.trim()}</p>`).join('');
      content.innerHTML = `
        <div class="flex items-center gap-2 text-primary mb-3">
          <span class="material-symbols-outlined text-2xl">gavel</span>
          <h3 class="font-headline text-2xl font-bold">Правила покупки</h3>
        </div>
        <div class="space-y-3 text-xs text-on-surface leading-relaxed">
          ${paragraphs}
        </div>
      `;
    } else if (type === 'exchange') {
      const rawExchange = texts.exchange_text || '';
      const paragraphs = rawExchange.split('\n').filter(p => p.trim()).map(p => `<p class="leading-relaxed">${p.trim()}</p>`).join('');
      content.innerHTML = `
        <div class="flex items-center gap-2 text-primary mb-3">
          <span class="material-symbols-outlined text-2xl">published_with_changes</span>
          <h3 class="font-headline text-2xl font-bold">Обмін та повернення</h3>
        </div>
        <div class="space-y-3 text-xs text-on-surface leading-relaxed">
          ${paragraphs}
        </div>
      `;
    }

    modal.classList.remove('hidden');
  };

  window.closePolicyModal = function() {
    const modal = document.getElementById('policy-modal');
    if (modal) modal.classList.add('hidden');
  };

  window.prevReviewSlide = function() {
    const reviews = BelleStore.getCustomerReviews();
    if (reviews.length === 0) return;
    reviewSlideIndex = (reviewSlideIndex - 1 + reviews.length) % reviews.length;
    updateReviewModalSlide(reviews);
  };

  window.nextReviewSlide = function() {
    const reviews = BelleStore.getCustomerReviews();
    if (reviews.length === 0) return;
    reviewSlideIndex = (reviewSlideIndex + 1) % reviews.length;
    updateReviewModalSlide(reviews);
  };

  function updateReviewModalSlide(reviews) {
    const imgEl = document.getElementById('review-modal-img');
    const capEl = document.getElementById('review-modal-caption');
    const dots = document.getElementById('review-dots-container');
    if (imgEl && reviews[reviewSlideIndex]) {
      imgEl.src = reviews[reviewSlideIndex].img;
    }
    if (capEl && reviews[reviewSlideIndex]) {
      capEl.textContent = reviews[reviewSlideIndex].caption || 'Фото відгуку клієнтки';
    }
    if (dots) {
      dots.innerHTML = reviews.map((_, i) => `<span class="w-2 h-2 rounded-full ${i === reviewSlideIndex ? 'bg-primary' : 'bg-outline/30'}"></span>`).join('');
    }
  }
</script>

<!-- Universal Footer -->

  <div class="bg-surface border border-surface-container-high max-w-2xl w-full p-6 sm:p-8 shadow-2xl relative max-h-[85vh] overflow-y-auto rounded-xs">
    <button onclick="closePolicyModal()" class="absolute top-4 right-4 text-outline hover:text-primary transition-colors">
      <span class="material-symbols-outlined text-[24px]">close</span>
    </button>

    <div id="policy-modal-content">
      <!-- Injected dynamically -->
    </div>

    <div class="mt-6 pt-4 border-t border-surface-container-high flex justify-end">
      <button onclick="closePolicyModal()" class="px-6 py-2 bg-primary text-white text-xs uppercase tracking-wider font-semibold hover:bg-tertiary transition-colors">
        Зрозуміло
      </button>
    </div>
  </div>
</div>
<!-- Modal: Wishlist -->
<div id="wishlist-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4 hidden">
  <div class="bg-surface border border-surface-container-high max-w-md w-full p-6 shadow-2xl relative max-h-[85vh] flex flex-col rounded-xs">
    <div class="flex items-center justify-between pb-3 border-b border-surface-container-high">
      <div class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-[22px]">favorite</span>
        <h3 class="font-headline text-xl font-bold text-on-surface">Обрані товари</h3>
      </div>
      <button onclick="closeWishlistModal()" class="text-outline hover:text-primary transition-colors p-1">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
    </div>

    <div id="wishlist-modal-items" class="space-y-3 py-4 overflow-y-auto flex-1 max-h-[60vh]">
      <!-- Wishlist items dynamically injected -->
    </div>

    <div class="pt-3 border-t border-surface-container-high flex justify-end">
      <button onclick="closeWishlistModal()" class="px-5 py-2 bg-primary text-white text-xs uppercase tracking-wider font-semibold hover:bg-tertiary transition-colors rounded-xs">
        Закрити
      </button>
    </div>
  </div>
</div>
